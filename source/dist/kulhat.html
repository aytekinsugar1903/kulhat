<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <meta name="theme-color" content="#0b141e" />
    <meta
      name="description"
      content="KÜLHAT: Son Teslimat. Western kasabası, dağ patikası, maden vagonları ve 40 uzun görevli 3D kurye macerası."
    />
    <title>KÜLHAT · Son Teslimat</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #0b141e;
        color: #e8edf3;
        font-family: system-ui;
        overflow: hidden;
      }
      #view {
        position: fixed;
        inset: 0;
        touch-action: none;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        padding: max(22px, env(safe-area-inset-top)) 25px 20px;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 19px;
        letter-spacing: 5px;
        font-weight: 900;
      }
      .brand img {
        width: 36px;
        height: 36px;
      }
      .sub {
        font-size: 8px;
        color: #a7bcc6;
        letter-spacing: 3px;
        margin-top: 4px;
      }
      .status {
        display: flex;
        gap: 15px;
        align-items: center;
        font-size: 11px;
      }
      .status button {
        pointer-events: auto;
      }
      .mission {
        margin-top: 25px;
        width: 230px;
        text-shadow: 0 2px 5px #000;
      }
      .label {
        font-size: 9px;
        letter-spacing: 2px;
        color: #c0ced5;
      }
      .mission b {
        font-size: 14px;
        display: block;
        margin: 8px 0;
      }
      .progress {
        height: 3px;
        background: #ffffff22;
        border-radius: 5px;
        overflow: hidden;
      }
      .progress i {
        display: block;
        height: 100%;
        background: #a1e6da;
        transition: width 0.15s;
      }
      .vitals {
        margin-top: 13px;
        display: flex;
        gap: 15px;
        font-size: 12px;
        color: #c0e4de;
      }
      .hint {
        position: fixed;
        bottom: max(20px, env(safe-area-inset-bottom));
        width: 100%;
        text-align: center;
        font-size: 9px;
        letter-spacing: 1px;
        color: #e0e6edbb;
        pointer-events: none;
        padding: 0 18px;
      }
      .callout {
        position: fixed;
        top: 29%;
        width: 100%;
        text-align: center;
        font-size: 12px;
        font-weight: 800;
        color: #ffdbaf;
        letter-spacing: 2px;
        pointer-events: none;
        text-shadow: 0 2px 12px #000;
        padding: 0 20px;
      }
      .bottomstats {
        position: fixed;
        bottom: max(55px, calc(env(safe-area-inset-bottom) + 30px));
        left: 25px;
        right: 25px;
        display: flex;
        justify-content: space-between;
        align-items: end;
        pointer-events: none;
        font-size: 10px;
        color: #b2ded8;
        text-shadow: 0 2px 6px #000;
      }
      .bottomstats span {
        display: block;
        margin-top: 7px;
      }
      .bottomstats .right {
        text-align: right;
      }
      .danger {
        color: #ff9d87 !important;
      }
      .route {
        position: fixed;
        top: 20%;
        right: 25px;
        font-size: 11px;
        font-weight: 700;
        color: #ecd3aa;
        text-shadow: 0 2px 6px #000;
        pointer-events: none;
      }
      .veil {
        position: fixed;
        inset: 0;
        background: linear-gradient(90deg, #060d19f2, #09111bb5 48%, #09111b22);
        display: flex;
        align-items: center;
        padding: 4vh 7vw;
        overflow-y: auto;
      }
      .card {
        max-width: 560px;
        width: 100%;
        max-height: 92dvh;
        overflow-y: auto;
        padding-right: 12px;
        scrollbar-width: thin;
        scrollbar-color: #496c78 transparent;
      }
      .eyebrow {
        font-size: 10px;
        letter-spacing: 4px;
        color: #9ae6d7;
      }
      h1 {
        font-size: clamp(52px, 6.8vw, 86px);
        line-height: 0.93;
        letter-spacing: -4px;
        font-weight: 900;
        margin: 20px 0;
      }
      h1 em {
        font-style: normal;
        color: #b0ecde;
      }
      .card p {
        color: #b8c7d1;
        font-size: 13px;
        line-height: 1.85;
        max-width: 490px;
      }
      .row {
        display: flex;
        gap: 10px;
        margin-top: 18px;
        flex-wrap: wrap;
      }
      button {
        border: 1px solid #8db5ba55;
        border-radius: 10px;
        background: #172c3f;
        color: #d9e9ec;
        padding: 12px 16px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
        touch-action: manipulation;
      }
      button:focus-visible {
        outline: 3px solid #ffd09a;
        outline-offset: 3px;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .primary {
        background: #b0e6d6;
        color: #142c34;
        border: 0;
        font-weight: 800;
        padding: 16px 24px;
      }
      .upgrade {
        display: flex;
        gap: 8px;
        margin-top: 14px;
      }
      .upgrade button {
        flex: 1;
        text-align: left;
        font-size: 10px;
        padding: 10px;
      }
      .upgrade small {
        display: block;
        color: #e5ca97;
        margin-top: 5px;
      }
      .arsenal {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin: 10px 0 18px;
      }
      .weapon-card {
        border: 1px solid #6f899744;
        background: #132435cc;
        border-radius: 12px;
        padding: 11px;
      }
      .weapon-card.selected {
        border-color: #79e1d0;
        box-shadow: inset 0 0 20px #3bb9a719;
      }
      .weapon-card b,
      .weapon-card small {
        display: block;
      }
      .weapon-card small {
        color: #9fb4be;
        font-size: 9px;
        margin: 5px 0 9px;
      }
      .weapon-card div {
        display: flex;
        gap: 5px;
      }
      .weapon-card button {
        flex: 1;
        padding: 8px 5px;
        font-size: 9px;
      }
      .tip {
        font-size: 10px;
        color: #9bb2bf;
        margin-top: 16px;
        line-height: 1.9;
      }
      .flash {
        position: fixed;
        inset: 0;
        box-shadow: inset 0 0 100px #ff414100;
        pointer-events: none;
        transition: box-shadow 0.2s;
      }
      .flash.hit {
        box-shadow: inset 0 0 130px #ff414199;
      }
      .error {
        position: fixed;
        inset: 0;
        background: #101b2e;
        display: grid;
        place-content: center;
        padding: 30px;
        z-index: 20;
      }
      .loading {
        position: fixed;
        inset: 0;
        background: #0b1524;
        display: grid;
        place-content: center;
        text-align: center;
        z-index: 30;
        color: #a5ded6;
        font-size: 15px;
        letter-spacing: 3px;
      }
      .loading img {
        width: 96px;
        height: 96px;
        margin: 0 auto 25px;
      }
      .loading small {
        font-size: 10px;
        color: #7d95a8;
        letter-spacing: 1px;
        margin-top: 15px;
      }
      .mission-objective {
        font-size: 10px;
        color: #e2c593;
        margin-top: 12px;
        line-height: 1.7;
      }
      .menu-summary {
        display: flex;
        gap: 22px;
        font-size: 11px;
        color: #dfccaa;
        margin: 15px 0;
      }
      .retention-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin: 12px 0 18px;
      }
      .retention-card {
        position: relative;
        overflow: hidden;
        min-height: 66px;
        padding: 12px;
        border: 1px solid #79bdbb33;
        border-radius: 10px;
        background: linear-gradient(135deg, #173746dd, #1c2a3ddd);
      }
      .retention-card b,
      .retention-card span {
        display: block;
      }
      .retention-card b {
        color: #9fe4d8;
        font-size: 9px;
        letter-spacing: 1.4px;
      }
      .retention-card span {
        margin-top: 7px;
        color: #b9c9d0;
        font-size: 9px;
        line-height: 1.45;
      }
      .retention-card i {
        position: absolute;
        bottom: 0;
        left: 0;
        height: 3px;
        background: #78e4cf;
      }
      .retention-card.complete {
        border-color: #e7c78788;
      }
      .reward-callout,
      .story-callout {
        padding: 12px;
        border: 1px solid #e6c17c55;
        border-radius: 10px;
        background: #3b3327aa;
        color: #ffe0a3 !important;
      }
      .district-tabs {
        display: flex;
        gap: 7px;
        margin: 16px 0 8px;
      }
      .district-tabs button {
        padding: 9px 13px;
        font-size: 11px;
        background: #172d3bbb;
      }
      .district-tabs button.active {
        background: #a4dacb;
        color: #153437;
        border-color: #a4dacb;
      }
      .district-name {
        font-size: 11px;
        letter-spacing: 2px;
        color: #b5cbc9;
        margin: 13px 0;
      }
      .mission-list {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 7px;
      }
      .mission-card {
        position: relative;
        text-align: left;
        padding: 11px;
        background: #1d3444bb;
      }
      .mission-card strong {
        font-size: 11px;
        display: block;
      }
      .mission-card small {
        font-size: 9px;
        color: #a3b9c6;
        display: block;
        margin-top: 6px;
      }
      .mission-card span {
        font-size: 8px;
        color: #d9bf8a;
        display: block;
        margin-top: 6px;
        letter-spacing: 1px;
      }
      .mission-card.active {
        border-color: #e7c797;
        background: #3b4649;
      }
      .menu-settings {
        display: flex;
        gap: 8px;
        margin-top: 17px;
        flex-wrap: wrap;
      }
      .menu-settings button {
        font-size: 8px;
        padding: 9px 11px;
        background: #10273788;
      }
      .storage,
      .build-label {
        font-size: 8px;
        color: #8ca6b6;
        line-height: 1.6;
        margin-top: 12px;
      }
      .build-label {
        color: #b4a28f;
        margin-top: 6px;
      }
      .result-stars {
        font-size: 35px;
        color: #f1cd8d;
        letter-spacing: 7px;
      }
      .result-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 17px;
        margin: 20px 0;
      }
      .result-grid span {
        font-size: 10px;
        color: #9eb5c2;
      }
      .result-grid b {
        display: block;
        font-size: 20px;
        color: #d5e9e8;
        margin-bottom: 5px;
      }
      .help-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px 25px;
      }
      .help-grid b {
        display: block;
        color: #e1d2b3;
        margin-bottom: 4px;
      }
      .help-grid p {
        font-size: 11px;
      }
      #quality {
        font-size: 8px;
        padding: 8px;
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 650px) {
        .retention-grid {
          grid-template-columns: 1fr;
        }
        .hud {
          padding: max(15px, env(safe-area-inset-top)) 16px;
        }
        .brand {
          font-size: 16px;
          letter-spacing: 3px;
          gap: 8px;
        }
        .brand img {
          width: 29px;
          height: 29px;
        }
        .status {
          gap: 8px;
          font-size: 10px;
        }
        .status #fps {
          display: none;
        }
        .mission {
          margin-top: 20px;
          width: 180px;
        }
        .mission b {
          font-size: 12px;
        }
        .vitals {
          font-size: 10px;
          gap: 10px;
        }
        .veil {
          padding: 20px 23px;
          align-items: start;
        }
        .card {
          padding: 15px 4px 15px 0;
          max-height: 95dvh;
        }
        .campaign h1 {
          font-size: 56px;
          margin: 16px 0;
          letter-spacing: -3px;
        }
        .campaign .intro {
          font-size: 11px;
          line-height: 1.7;
          margin: 10px 0;
        }
        .mission-objective {
          font-size: 10px;
          color: #e2c593;
          margin-top: 12px;
          line-height: 1.7;
        }
        .menu-summary {
          font-size: 10px;
          gap: 16px;
          margin: 12px 0;
        }
        .district-tabs {
          margin-top: 12px;
          gap: 6px;
        }
        .district-tabs button {
          padding: 8px 11px;
        }
        .mission-card {
          padding: 10px;
        }
        .mission-card strong {
          font-size: 10px;
        }
        .mission-card small {
          font-size: 8px;
        }
        .mission-card span {
          font-size: 8px;
        }
        .row {
          margin-top: 12px;
          gap: 7px;
        }
        .row button {
          font-size: 11px;
        }
        .primary {
          padding: 14px 19px;
        }
        .tip {
          font-size: 8px;
          margin-top: 12px;
        }
        .upgrade button {
          font-size: 9px;
          padding: 9px;
        }
        .callout {
          font-size: 10px;
          top: 30%;
        }
        .route {
          font-size: 9px;
          right: 16px;
          top: 22%;
        }
        .bottomstats {
          left: 16px;
          right: 16px;
          font-size: 9px;
        }
        .status button {
          padding: 9px;
        }
        .hint {
          font-size: 8px;
          line-height: 1.7;
        }
        .result-grid b {
          font-size: 18px;
        }
        .help-grid {
          gap: 5px 15px;
        }
        h1 {
          font-size: 55px;
        }
        .help-card h1 {
          font-size: 44px;
        }
        #quality {
          display: none;
        }
      }
      @media (max-height: 650px) and (orientation: landscape) {
        .veil {
          padding: 12px 5vw;
        }
        .card {
          max-width: 650px;
        }
        .campaign h1 {
          font-size: 45px;
        }
        .mission-list {
          grid-template-columns: repeat(3, 1fr);
        }
        .campaign .intro,
        .campaign .tip {
          display: none;
        }
        .mission-objective {
          font-size: 10px;
          color: #e2c593;
          margin-top: 12px;
          line-height: 1.7;
        }
        .menu-summary {
          margin: 7px 0;
        }
        .district-tabs {
          margin-top: 10px;
        }
        .hud {
          padding: 12px 18px;
        }
        .mission {
          margin-top: 10px;
        }
        .callout {
          top: 22%;
        }
        .vitals {
          margin-top: 7px;
        }
        .bottomstats {
          bottom: 40px;
        }
      }
      .hud {
        z-index: 3;
      }
      .status,
      .mission,
      .bottomstats > div,
      .route,
      .callout:not(:empty),
      .hint {
        background: rgba(7, 17, 24, 0.88);
        border: 1px solid #a9c9d044;
        border-radius: 12px;
        color: #f4fbff;
        text-shadow: 0 1px 2px #000;
      }
      .status {
        padding: 10px 12px;
        font-size: 15px;
        max-width: 55%;
        flex-wrap: wrap;
        gap: 9px;
        min-width: 0;
        flex: 1 1 auto;
      }
      #coins {
        font-weight: 800;
        line-height: 1.4;
        overflow-wrap: anywhere;
      }
      .mission {
        width: min(320px, 58vw);
        padding: 13px 15px;
        margin-top: 12px;
      }
      .mission b {
        font-size: 19px;
      }
      .label {
        font-size: 12px;
        line-height: 1.4;
        letter-spacing: 1px;
        color: #d5ecef;
      }
      .vitals {
        font-size: 16px;
        flex-wrap: wrap;
        gap: 10px;
        color: #e4fff4;
      }
      .bottomstats {
        font-size: 15px;
        gap: 12px;
        z-index: 3;
        align-items: end;
      }
      .bottomstats > div {
        padding: 10px 13px;
        max-width: 52%;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }
      .bottomstats .right {
        max-width: 45%;
      }
      #cargo,
      #shield,
      #ammo {
        font-weight: 800;
      }
      #objective {
        font-size: 13px;
        color: #ffe3a9;
      }
      .route {
        top: 190px;
        right: 20px;
        max-width: min(260px, 36vw);
        padding: 10px;
        font-size: 14px;
        line-height: 1.45;
        z-index: 3;
      }
      .route:empty {
        display: none;
      }
      .callout:not(:empty) {
        left: 50%;
        transform: translateX(-50%);
        width: max-content;
        max-width: calc(100% - 30px);
        padding: 10px 14px;
        font-size: 14px;
        letter-spacing: 0.3px;
        z-index: 4;
      }
      .hint {
        left: 50%;
        transform: translateX(-50%);
        width: max-content;
        max-width: calc(100% - 24px);
        font-size: 11px;
        padding: 7px 10px;
        z-index: 3;
      }
      .veil {
        z-index: 8;
        align-items: start;
      }
      .card {
        box-sizing: border-box;
        background: #0b1925ed;
        border: 1px solid #8eb2bc44;
        border-radius: 18px;
        padding: 20px;
      }
      .scoreboard {
        margin: 20px 0 4px;
        padding: 16px;
        background: #061019eb;
        border: 1px solid #acc3c64d;
        border-radius: 12px;
      }
      .scoreboard h2 {
        font-size: 14px;
        letter-spacing: 0.6px;
        line-height: 1.5;
      }
      .scoreboard table {
        border-collapse: collapse;
        font-size: 13px;
      }
      .scoreboard td,
      .scoreboard th {
        padding: 9px 5px;
        border-bottom: 1px solid #b7d4dc22;
      }
      .scoreboard td:last-child {
        white-space: nowrap;
        text-align: right;
        color: #ffdfa3;
        font-weight: 800;
      }
      .choice-group {
        margin-top: 16px;
        padding: 12px;
        background: #142533d9;
        border: 1px solid #9fb7bd44;
        border-radius: 12px;
      }
      .choice-group h2 {
        font-size: 12px;
        letter-spacing: 2px;
        color: #c6dce3;
        margin: 0 0 10px;
      }
      .choice-group .row {
        margin: 0;
      }
      .choice-group button {
        font-size: 12px;
        min-height: 44px;
        flex: 1 1 115px;
        padding: 10px;
      }
      .choice-selected {
        border: 2px solid #9ff3cf;
        background: #24554a;
        color: #effff7;
        font-weight: 800;
        box-shadow: inset 0 0 0 1px #9ff3cf44;
      }
      .choice-selected::before {
        content: "✓ ";
        color: #b8ffdb;
      }
      .quick-tools {
        position: sticky;
        top: -20px;
        background: #0b1925f5;
        padding: 10px 0;
        z-index: 2;
        display: flex;
        justify-content: flex-end;
      }
      .quick-tools button {
        color: #ffe3ad;
        border-color: #d9b97988;
        font-weight: 800;
      }
      .armory-panel {
        position: fixed;
        inset: 5vh max(4vw, calc((100vw - 720px) / 2));
        z-index: 12;
        overflow-y: auto;
        padding: 18px;
        border-radius: 16px;
        border: 1px solid #b5d2d5;
        background: #0a1826fa;
        box-shadow: 0 0 0 100vmax #020710bb;
      }
      .armory-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        position: sticky;
        top: -18px;
        background: #0a1826;
        padding: 12px 0;
        z-index: 1;
      }
      .armory-heading h2 {
        font-size: 17px;
      }
      .armory-panel[hidden] {
        display: none;
      }
      .fork-signs {
        position: fixed;
        top: 38%;
        left: 50%;
        transform: translateX(-50%);
        width: min(620px, calc(100% - 24px));
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        z-index: 5;
        pointer-events: none;
      }
      .fork-signs > div {
        min-width: 0;
        padding: 11px 6px;
        background: #091921f5;
        border: 2px solid #a4dbce;
        border-radius: 10px;
        text-align: center;
        box-shadow: 0 3px 12px #0008;
      }
      .fork-signs b {
        display: block;
        font-size: 16px;
        line-height: 1.25;
        overflow-wrap: anywhere;
        color: #f5fff9;
      }
      .fork-signs small {
        display: block;
        margin-top: 7px;
        font-size: 12px;
        color: #ffe4aa;
        line-height: 1.3;
      }
      .fork-signs[hidden] {
        display: none;
      }
      @media (max-width: 600px) {
        .hud {
          padding: max(12px, env(safe-area-inset-top)) 12px 12px;
